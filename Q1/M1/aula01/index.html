	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "*");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		};

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){
			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;
			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}
			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}
		}

		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "*");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
		};

<!-- SLIDE 3: O QUE É REST -->
<section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">
<div class="slide-content">
  <div class="mono blue" style="font-size: 16px; margin-bottom: 12px;">TEORIA RÁPIDA — FIELDING, 2000:</div>
  <h2>REST são <span>6 Restrições</span></h2>
  <div class="grid-2">
    <div class="unit-card fragment fade-up">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #00d4ff;">Cliente-Servidor</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Separação de responsabilidades. Evoluir um sem quebrar o outro.</p>
    </div>
    <div class="unit-card fragment fade-up">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #00d4ff;">Sem estado</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Cada requisição carrega tudo que o servidor precisa.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #22c55e !important;">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #22c55e;">Cache</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Resposta diz se pode ou não ser guardada.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #22c55e !important;">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #22c55e;">Interface uniforme</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">URI + verbo + representação. É a regra que você vai praticar hoje.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #f97316 !important;">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #f97316;">Camadas</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Gateway, balanceador, serviço — o cliente não sabe.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #a855f7 !important;">
      <p style="margin: 0; font-size: 18px;"><strong style="color: #a855f7;">Code-on-demand (opcional)</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Servidor pode entregar execução ao cliente.</p>
    </div>
  </div>
</div>
<div class="slide-footer"></div>
</div></script></section>

<!-- SLIDE 4: URIS E VERBOS -->
<section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

  <h2>URI é <span style="color: #f97316;">Substantivo</span>, Verbo é HTTP</h2>
  <div class="unit-card fragment fade-up" style="border-left-color: #ef4444 !important;">
    <p style="margin: 0; font-size: 20px;"><strong style="color: #ef4444;">✗ Errado</strong> &nbsp; <span class="mono" style="font-size: 15px; letter-spacing: 1px;">GET /criarPedido</span> &nbsp;·&nbsp; <span class="mono" style="font-size: 15px; letter-spacing: 1px;">POST /pedido/deletar</span></p>
    <p style="margin: 6px 0 0 0; font-size: 14px;">Ação no recurso = RPC disfarçado de REST.</p>
  </div>
  <div class="unit-card fragment fade-up" style="border-left-color: #22c55e !important;">
    <p style="margin: 0; font-size: 20px;"><strong style="color: #22c55e;">✓ Certo</strong> &nbsp; <span class="mono" style="font-size: 15px; letter-spacing: 1px;">POST /pedidos</span> &nbsp;·&nbsp; <span class="mono" style="font-size: 15px; letter-spacing: 1px;">DELETE /pedidos/123</span></p>
    <p style="margin: 6px 0 0 0; font-size: 14px;">Coleção, item, sub-recurso hierárquico.</p>
  </div>
  <div class="grid-2" style="margin-top: 4px;">
    <div class="unit-card fragment fade-up">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #00d4ff;">GET</strong> ler · <strong style="color: #00d4ff;">POST</strong> criar</p>
      <p style="margin: 4px 0 0 0; font-size: 14px;"><strong style="color: #22c55e;">PUT</strong> substituir · <strong style="color: #22c55e;">PATCH</strong> parcial</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #ef4444 !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #ef4444;">DELETE</strong> remover</p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Regra de ouro: <strong>plural</strong>, sem verbo, minúsculo.</p>
    </div>
  </div>
  <div class="highlight-box fragment fade-up">
    <p style="margin: 0; font-size: 16px !important;">💡 <strong style="color: #00d4ff;">Plural sempre:</strong> <span class="mono" style="font-size: 14px; letter-spacing: 1px;">/usuarios/10/pedidos</span> — itens de uma coleção.</p>
  </div>
</div>
<div class="slide-footer"></div>
</div></script></section>

<!-- SLIDE 5: STATUS CODES -->
<section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">
<div class="slide-content">
  <div class="mono blue" style="font-size: 16px; margin-bottom: 12px;">SINALIZAÇÃO — O QUE O STATUS DIZ:</div>
  <h2>Status Codes que <span>Importam</span></h2>
  <div class="grid-2">
    <div class="unit-card fragment fade-up" style="border-left-color: #22c55e !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #22c55e;">200 OK</strong> · <strong style="color: #22c55e;">201 Created</strong> · <strong style="color: #22c55e;">204 No Content</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Sucesso. 201 volta com <span class="mono" style="letter-spacing: 1px;">Location</span> do novo recurso.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #f97316 !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #f97316;">304 Not Modified</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Cache válido. Evita transferir o mesmo payload.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #ef4444 !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #ef4444;">400</strong> payload inválido · <strong style="color: #ef4444;">401</strong> não autenticado</p>
      <p style="margin: 4px 0 0 0; font-size: 14px;"><strong style="color: #ef4444;">403</strong> sem permissão · <strong style="color: #ef4444;">404</strong> não existe</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #a855f7 !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #a855f7;">409</strong> conflito · <strong style="color: #a855f7;">422</strong> regra de negócio</p>
      <p style="margin: 4px 0 0 0; font-size: 14px;"><strong style="color: #a855f7;">429</strong> rate limit — essencial em API com IA.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #ef4444 !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #ef4444;">500</strong> erro nosso · <strong style="color: #ef4444;">503</strong> indisponível</p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">5xx nunca deve expor stack trace ao cliente.</p>
    </div>
    <div class="unit-card fragment fade-up" style="border-left-color: #00d4ff !important;">
      <p style="margin: 0; font-size: 17px;"><strong style="color: #00d4ff;">Armadilha clássica</strong></p>
      <p style="margin: 4px 0 0 0; font-size: 14px;">Devolver <span class="mono" style="letter-spacing: 1px;">200 + erro</span> no corpo quebra monitoramento e cliente.</p>
    </div>
  </div>
</div>
<div class="slide-footer"></div>
</div></script></section>

    <p style="margin: 6px 0 0 0; font-size: 15px;">Listagem sem limite = timeout. Use <span class="mono" style="letter-spacing: 1px;">?page=2&amp;limit=20</span> ou cursor.</p>
  </div>
  <div class="unit-card fragment fade-up" style="border-left-color: #f97316 !important;">
    <p style="margin: 0; font-size: 19px;"><strong style="color: #f97316;">Filtragem e ordenação</strong></p>
    <p style="margin: 6px 0 0 0; font-size: 15px;">Query string: <span class="mono" style="letter-spacing: 1px;">?status=pendente&amp;sort=-criadoEm</span>.</p>
  </div>
  <div class="unit-card fragment fade-up" style="border-left-color: #a855f7 !important;">
    <p style="margin: 0; font-size: 19px;"><strong style="color: #a855f7;">Limites reais</strong></p>
    <p style="margin: 6px 0 0 0; font-size: 15px;">Defina <span class="mono" style="letter-spacing: 1px;">limit</span> máximo e devolva total/cursor para o cliente.</p>
  </div>
  <div class="highlight-box-green fragment fade-up">
    <p style="margin: 0; font-size: 16px !important;">✅ Criterio de qualidade: um dev novo lê a lista e sabe paginar <strong>sem perguntar</strong>.</p>

<div class="slide-footer"></div>

<!-- SLIDE 7: BOAS PRATICAS 2 -->
<section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

  <div class="mono orange" style="font-size: 16px; margin-bottom: 12px;">BOAS PRÁTICAS — PARTE 2:</div>
  <h2>Idempotência + <span style="color: #f97316;">Erros</span></h2>
  <div class="unit-card fragment fade-up" style="border-left-color: #f97316 !important;">
    <p style="margin: 0; font-size: 19px;"><strong style="color: #f97316;">Idempotência</strong></p>
    <p style="margin: 6px 0 0 0; font-size: 15px;"><strong>GET, PUT, DELETE</strong> repetidos = mesmo efeito. <strong>POST</strong> não é — por isso usamos <span class="mono" style="letter-spacing: 1px;">Idempotency-Key</span> em pagamentos.</p>
  </div>
  <div class="unit-card fragment fade-up" style="border-left-color: #ef4444 !important;">
    <p style="margin: 0; font-size: 19px;"><strong style="color: #ef4444;">Erro padronizado (RFC 7807)</strong></p>
    <p style="margin: 6px 0 0 0; font-size: 15px;">Content-Type <span class="mono" style="letter-spacing: 1px;">application/problem+json</span>: título, status, detalhe, tipo.</p>
  </div>
  <div class="codebox fragment fade-up">
<pre>{
  "type": "https://api.exemplo.com/erros/pedido-nao-encontrado",
  "title": "Pedido não encontrado",
  "status": 404,
  "detail": "Não existe pedido com id 987.",
  "traceId": "3f2b1c-9a4d"
}</pre>
  </div>
  <div class="unit-card fragment fade-up" style="border-left-color: #00d4ff !important;">
    <p style="margin: 0; font-size: 16px;"><strong style="color: #00d4ff;">traceId</strong> em toda resposta — é o que liga API, logs e alertas no CloudWatch.</p>
  </div>
</div>
<div class="slide-footer"></div>
</div></script></section>

<!-- SLIDE 9: ANATOMIA -->
<section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">
<div class="slide-content">
  <div class="mono" style="font-size: 16px; margin-bottom: 12px; color: #a855f7;">ANATOMIA — O ESSENCIAL:</div>
  <h2>Estrutura do <span style="color: #a855f7;">openapi.yaml</span></h2>
  <div class="codebox fragment fade-up">
<pre>openapi: 3.1.0
info:
  title: API de Pedidos
  version: 1.0.0
paths:
  /v1/pedidos:
    get:
      summary: Lista pedidos paginada
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pedido" }
    post:
      summary: Cria um pedido
      responses:
        "201": { description: Pedido criado }
        "400": { description: Payload inválido }</pre>
  </div>
  <p class="fragment fade-up" style="font-size: 16px !important;">🧩 <strong style="color: #fff;">paths</strong> descrevem a superfície; <strong style="color: #a855f7;">components</strong> guardam schemas e erros reutilizáveis via <span class="mono" style="letter-spacing: 1px;">$ref</span> — e <strong style="color: #22c55e;">required + enum</strong> viram validação automática no backend.</p>
</div>
<div class="slide-footer"></div>
</div></script></section>
